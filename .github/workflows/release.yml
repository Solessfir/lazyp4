name: Build

on:
  push:
    tags:
      - "v*"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.suffix }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            suffix: linux_x86_64
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
            suffix: linux_arm64
          - os: macos-13
            goos: darwin
            goarch: amd64
            suffix: darwin_x86_64
          - os: macos-latest
            goos: darwin
            goarch: arm64
            suffix: darwin_arm64
          - os: ubuntu-latest
            goos: windows
            goarch: amd64
            suffix: windows_x86_64
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build
        run: |
          if [ "${{ matrix.goos }}" = "windows" ]; then
            GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -ldflags="-s -w" -o lazyp4.exe ./cmd/main.go
            zip lazyp4_${{ matrix.suffix }}.zip lazyp4.exe
          else
            GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -ldflags="-s -w" -o lazyp4 ./cmd/main.go
            tar -czf lazyp4_${{ matrix.suffix }}.tar.gz lazyp4
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lazyp4_${{ matrix.suffix }}
          path: lazyp4_${{ matrix.suffix }}.*

  release:
    name: Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: dist/*
