name: Build

on:
  push:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build Linux (amd64)
        run: |
          mkdir -p dist
          GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o dist/lazyp4 ./cmd/main.go
          tar -czf dist/lazyp4-linux-amd64.tar.gz -C dist lazyp4
          rm dist/lazyp4

      - name: Build Linux (arm64)
        run: |
          GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o dist/lazyp4 ./cmd/main.go
          tar -czf dist/lazyp4-linux-arm64.tar.gz -C dist lazyp4
          rm dist/lazyp4

      - name: Build Windows (amd64)
        run: |
          GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o dist/lazyp4.exe ./cmd/main.go
          cd dist && zip lazyp4-windows-amd64.zip lazyp4.exe && rm lazyp4.exe

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lazyp4-${{ github.sha }}
          path: dist/
